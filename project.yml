name: Lumina
options:
  bundleIdPrefix: com.hodadako
  deploymentTarget:
    macOS: "13.0"
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.3.1
    HIKARI_MARKETING_VERSION: 0.1.6
    HIKARI_BUILD_NUMBER: 7
targets:
  LuminaCore:
    type: framework.static
    platform: macOS
    sources:
      - Sources/LuminaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.LuminaCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  LuminaNativeLock:
    type: framework.static
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/LuminaNativeLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.LuminaNativeLock
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  LuminaNativeTool:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/LuminaNativeTool
    dependencies:
      - target: LuminaNativeLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.Lumina.NativeTool
        PRODUCT_NAME: lumina-native-tool
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SKIP_INSTALL: YES
  Lumina:
    type: application
    platform: macOS
    sources:
      - Sources/LuminaApp
      - path: Resources/Assets.xcassets
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ko.lproj
        buildPhase: resources
    info:
      path: Resources/Lumina-Info.plist
      properties:
        CFBundleDisplayName: Lumina
        CFBundleName: Lumina
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Lumina contributors
    dependencies:
      - target: LuminaCore
      - target: LuminaScreenSaver
        embed: false
    postBuildScripts:
      - name: Embed Lumina Screen Saver
        script: |
          set -e
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/PlugIns"
          mkdir -p "${destination}"
          ditto "${BUILT_PRODUCTS_DIR}/Lumina.saver" "${destination}/Lumina.saver"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.Lumina
        PRODUCT_NAME: Lumina
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  LuminaScreenSaver:
    type: bundle
    platform: macOS
    sources:
      - Sources/LuminaScreenSaver
    info:
      path: Resources/LuminaScreenSaver-Info.plist
      properties:
        CFBundleDisplayName: Lumina
        CFBundleName: Lumina
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: LuminaScreenSaverView
        NSHighResolutionCapable: true
    dependencies:
      - target: LuminaCore
      - sdk: ScreenSaver.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.Lumina.ScreenSaver
        PRODUCT_NAME: Lumina
        PRODUCT_MODULE_NAME: LuminaScreenSaver
        WRAPPER_EXTENSION: saver
        MACH_O_TYPE: mh_bundle
        SKIP_INSTALL: YES
  LuminaNative:
    type: application
    platform: macOS
    productName: Hikari
    deploymentTarget: "15.0"
    sources:
      - Sources/LuminaApp
      - path: Resources/Assets.xcassets
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ko.lproj
        buildPhase: resources
    info:
      path: Resources/LuminaNative-Info.plist
      properties:
        CFBundleDisplayName: Hikari
        CFBundleName: Hikari
        CFBundleShortVersionString: $(HIKARI_MARKETING_VERSION)
        CFBundleVersion: $(HIKARI_BUILD_NUMBER)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Lumina contributors
    dependencies:
      - target: LuminaCore
      - target: LuminaNativeLock
      - target: LuminaNativeTool
        embed: false
    postBuildScripts:
      - name: Embed Native Local Tool
        script: |
          set -euo pipefail
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/MacOS"
          mkdir -p "${destination}"
          ditto "${BUILT_PRODUCTS_DIR}/lumina-native-tool" \
            "${destination}/lumina-native-tool"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.Lumina.NativeLocal
        PRODUCT_NAME: Hikari
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LUMINA_NATIVE_LOCAL
  LuminaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LuminaCoreTests
    dependencies:
      - target: LuminaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.LuminaCoreTests
  LuminaNativeLockTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/LuminaNativeLockTests
    dependencies:
      - target: LuminaNativeLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.LuminaNativeLockTests
schemes:
  Lumina:
    build:
      targets:
        Lumina: all
        LuminaCoreTests: [test]
    test:
      targets:
        - LuminaCoreTests
      gatherCoverageData: true
  LuminaNative:
    build:
      targets:
        LuminaNative: all
        LuminaNativeTool: all
        LuminaCoreTests: [test]
        LuminaNativeLockTests: [test]
    test:
      targets:
        - LuminaCoreTests
        - LuminaNativeLockTests
      gatherCoverageData: true
