name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and tag gates
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.version.outputs.is_tag }}
      tag_version: ${{ steps.version.outputs.tag_version }}
      build_matrix: ${{ steps.version.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Reject retired product naming
        shell: bash
        run: |
          set -euo pipefail
          retired_product="$(printf '\114\165\155\151\156\141')"
          if git grep -Iin "${retired_product}" -- .; then
            echo "Retired product naming remains in tracked content." >&2
            exit 1
          fi
          if git ls-files | grep -i "${retired_product}"; then
            echo "Retired product naming remains in a tracked path." >&2
            exit 1
          fi
      - id: version
        name: Validate Hikari tag and marketing version
        shell: bash
        run: |
          set -euo pipefail
          is_tag=false
          tag_version=""
          build_matrix='{"runner":["macos-15","macos-15-intel","macos-26","macos-26-intel"]}'

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            build_matrix='{"runner":["macos-15"]}'
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            is_tag=true
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            tag_version="${GITHUB_REF_NAME#v}"
            marketing_version="$(awk '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
            if [[ "${tag_version}" != "${marketing_version}" ]]; then
              echo "Tag ${tag_version} does not match MARKETING_VERSION ${marketing_version}" >&2
              exit 1
            fi
          fi

          {
            echo "is_tag=${is_tag}"
            echo "tag_version=${tag_version}"
            echo "build_matrix=${build_matrix}"
          } >> "${GITHUB_OUTPUT}"

  build-and-test:
    name: Build and test (${{ matrix.runner }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Hikari Xcode project
        run: xcodegen generate
      - name: Debug build
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Unit test
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Release build and bundle checks
        if: github.event_name != 'pull_request'
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/HikariDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="${DERIVED_DATA_PATH}/Build/Products/Release/Hikari.app"
          test -d "${app_path}"
          test -x "${app_path}/Contents/MacOS/Hikari"
          test -x "${app_path}/Contents/MacOS/hikari-native-tool"
          test ! -d "${app_path}/Contents/PlugIns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "${app_path}/Contents/Info.plist")" = "Hikari"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Contents/Info.plist")" = "com.hodadako.Hikari.NativeLocal"

  release-coverage:
    name: Hikari release coverage (${{ matrix.runner }})
    needs: metadata
    if: needs.metadata.outputs.is_tag == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            codecov_flag: macos-15-arm64
          - runner: macos-15-intel
            codecov_flag: macos-15-intel
          - runner: macos-26
            codecov_flag: macos-26-arm64
          - runner: macos-26-intel
            codecov_flag: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Hikari Xcode project
        run: xcodegen generate
      - name: Run Hikari tests with coverage
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath "${RUNNER_TEMP}/Hikari-${{ matrix.codecov_flag }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Upload Hikari coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hodadako/hikari
          plugins: xcode
          swift_project: Hikari
          flags: ${{ matrix.codecov_flag }}
          name: hikari-${{ matrix.codecov_flag }}
          fail_ci_if_error: true

  package:
    name: Package Hikari release artifact
    needs: [metadata, build-and-test, release-coverage]
    if: >-
      always() &&
      needs.metadata.outputs.is_tag == 'true' &&
      needs.build-and-test.result == 'success' &&
      needs.release-coverage.result == 'success'
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Hikari Xcode project
        run: xcodegen generate
      - name: Build and sign Hikari for release
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/HikariDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="${DERIVED_DATA_PATH}/Build/Products/Release/Hikari.app"
          test -d "${app_path}"
          test -x "${app_path}/Contents/MacOS/Hikari"
          test -x "${app_path}/Contents/MacOS/hikari-native-tool"
          codesign --force --deep --sign - "${app_path}"
          codesign --verify --deep --strict "${app_path}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "${app_path}" \
            "dist/Hikari-macOS-portable.zip"
          (
            cd dist
            shasum -a 256 "Hikari-macOS-portable.zip" \
              > "Hikari-macOS-portable.zip.sha256"
            shasum -a 256 -c "Hikari-macOS-portable.zip.sha256"
          )
      - name: Upload Hikari artifact
        uses: actions/upload-artifact@v7
        with:
          name: Hikari-macOS-portable
          path: |
            dist/Hikari-macOS-portable.zip
            dist/Hikari-macOS-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Hikari tagged release
    needs: [metadata, package]
    if: always() && needs.metadata.outputs.is_tag == 'true' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Hikari-macOS-portable
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/Hikari-macOS-portable.zip \
              dist/Hikari-macOS-portable.zip.sha256 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/Hikari-macOS-portable.zip \
              dist/Hikari-macOS-portable.zip.sha256 \
              --title "Hikari ${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --generate-notes
          fi
