name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and tag gates
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.version.outputs.is_tag }}
      tag_version: ${{ steps.version.outputs.tag_version }}
      docs_only: ${{ steps.version.outputs.docs_only }}
      build_matrix: ${{ steps.version.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Classify changes and validate Hikari tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          is_tag=false
          tag_version=""
          docs_only=false
          build_matrix='{"include":[{"runner":"macos-15","codecov_flag":"macos-15-arm64"},{"runner":"macos-15-intel","codecov_flag":"macos-15-intel"}]}'

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${PR_BASE_SHA}" || -z "${PR_HEAD_SHA}" ]]; then
              echo "Pull request base/head SHA is unavailable" >&2
              exit 1
            fi
            if ! git cat-file -e "${PR_BASE_SHA}^{commit}" ||
               ! git cat-file -e "${PR_HEAD_SHA}^{commit}"; then
              echo "Unable to resolve pull request base/head commit" >&2
              exit 1
            fi

            docs_only=true
            changed_files=false
            while IFS= read -r changed_path; do
              [[ -z "${changed_path}" ]] && continue
              changed_files=true
              case "${changed_path}" in
                docs/*|*.md) ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done < <(git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}")

            if [[ "${changed_files}" != "true" ]]; then
              docs_only=false
            fi

            build_matrix='{"include":[{"runner":"macos-15","codecov_flag":"macos-15-arm64"}]}'
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            is_tag=true
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            tag_version="${GITHUB_REF_NAME#v}"
            marketing_version="$(awk '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
            if [[ "${tag_version}" != "${marketing_version}" ]]; then
              echo "Tag ${tag_version} does not match MARKETING_VERSION ${marketing_version}" >&2
              exit 1
            fi
            build_matrix='{"include":[{"runner":"macos-15","codecov_flag":"macos-15-arm64"},{"runner":"macos-15-intel","codecov_flag":"macos-15-intel"},{"runner":"macos-26","codecov_flag":"macos-26-arm64"},{"runner":"macos-26-intel","codecov_flag":"macos-26-intel"}]}'
          fi

          {
            echo "is_tag=${is_tag}"
            echo "tag_version=${tag_version}"
            echo "docs_only=${docs_only}"
            echo "build_matrix=${build_matrix}"
          } >> "${GITHUB_OUTPUT}"

  build-and-test:
    name: Build and test (${{ matrix.runner }})
    needs: metadata
    if: needs.metadata.result == 'success' && needs.metadata.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Hikari Xcode project
        run: xcodegen generate
      - name: Debug build
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Unit test
        if: needs.metadata.outputs.is_tag != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Unit test with coverage
        if: needs.metadata.outputs.is_tag == 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath "${RUNNER_TEMP}/Hikari-${{ matrix.codecov_flag }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Upload Hikari coverage to Codecov
        if: needs.metadata.outputs.is_tag == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hodadako/hikari
          plugins: xcode
          swift_project: Hikari
          flags: ${{ matrix.codecov_flag }}
          name: hikari-${{ matrix.codecov_flag }}
          fail_ci_if_error: true
      - name: Build, sign, and package Hikari release artifact
        if: needs.metadata.outputs.is_tag == 'true' && matrix.runner == 'macos-15'
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/HikariDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project Hikari.xcodeproj \
            -scheme Hikari \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="${DERIVED_DATA_PATH}/Build/Products/Release/Hikari.app"
          test -d "${app_path}"
          test -x "${app_path}/Contents/MacOS/Hikari"
          test -x "${app_path}/Contents/MacOS/hikari-native-tool"
          test ! -d "${app_path}/Contents/PlugIns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "${app_path}/Contents/Info.plist")" = "Hikari"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Contents/Info.plist")" = "com.hodadako.Hikari.NativeLocal"
          codesign --force --deep --sign - "${app_path}"
          codesign --verify --deep --strict "${app_path}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "${app_path}" \
            "dist/Hikari-macOS-portable.zip"
          (
            cd dist
            shasum -a 256 "Hikari-macOS-portable.zip" \
              > "Hikari-macOS-portable.zip.sha256"
            shasum -a 256 -c "Hikari-macOS-portable.zip.sha256"
          )
      - name: Upload Hikari artifact
        if: needs.metadata.outputs.is_tag == 'true' && matrix.runner == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: Hikari-macOS-portable
          path: |
            dist/Hikari-macOS-portable.zip
            dist/Hikari-macOS-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Hikari tagged release
    needs: [metadata, build-and-test]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.metadata.outputs.is_tag == 'true' &&
      needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Hikari-macOS-portable
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/Hikari-macOS-portable.zip \
              dist/Hikari-macOS-portable.zip.sha256 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/Hikari-macOS-portable.zip \
              dist/Hikari-macOS-portable.zip.sha256 \
              --title "Hikari ${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --generate-notes
          fi

  ci-gate:
    name: CI Gate
    if: always()
    needs: [metadata, build-and-test, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required CI results
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          DOCS_ONLY: ${{ needs.metadata.outputs.docs_only }}
          IS_TAG: ${{ needs.metadata.outputs.is_tag }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail

          if [[ "${METADATA_RESULT}" != "success" ]]; then
            echo "Metadata and change classification did not succeed: ${METADATA_RESULT}" >&2
            exit 1
          fi

          if [[ "${DOCS_ONLY}" == "true" ]]; then
            echo "Documentation-only pull request: macOS build and test were intentionally skipped."
          elif [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Build and test did not succeed: ${BUILD_RESULT}" >&2
            exit 1
          fi

          if [[ "${IS_TAG}" == "true" && "${RELEASE_RESULT}" != "success" ]]; then
            echo "Tagged release publication did not succeed: ${RELEASE_RESULT}" >&2
            exit 1
          fi

          echo "CI Gate passed."
