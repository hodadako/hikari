name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Build/test jobs never need to write repository contents. The release job
# below grants contents: write only after every required build gate succeeds.
permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and tag gates
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.version.outputs.is_tag }}
      is_major: ${{ steps.version.outputs.is_major }}
      tag_version: ${{ steps.version.outputs.tag_version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate tag and marketing version
        shell: bash
        run: |
          set -euo pipefail
          is_tag=false
          is_major=false
          tag_version=""

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            is_tag=true
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            tag_version="${GITHUB_REF_NAME#v}"
            marketing_version="$(awk '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
            if [[ "${tag_version}" != "${marketing_version}" ]]; then
              echo "Tag ${tag_version} does not match MARKETING_VERSION ${marketing_version}" >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.0\.0$ ]]; then
              is_major=true
            fi
          fi

          {
            echo "is_tag=${is_tag}"
            echo "is_major=${is_major}"
            echo "tag_version=${tag_version}"
          } >> "${GITHUB_OUTPUT}"

  build-and-test:
    name: Build and test (${{ matrix.runner }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Debug build
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Unit test with coverage
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath "${RUNNER_TEMP}/Lumina.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Upload standard coverage to Codecov
        if: matrix.runner == 'macos-15'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hodadako/lumina
          plugins: xcode
          swift_project: Lumina
          fail_ci_if_error: false
      - name: Release build and bundle checks
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/LuminaDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="${DERIVED_DATA_PATH}/Build/Products/Release/Lumina.app"
          test -d "${app_path}"
          test -d "${app_path}/Contents/PlugIns/Lumina.saver"
          test ! -e "${app_path}/Contents/Frameworks/LuminaNativeLock.framework"
          test ! -e "${app_path}/Contents/MacOS/lumina-native-tool"

  major_compatibility:
    name: Major compatibility (${{ matrix.runner }})
    needs: metadata
    if: needs.metadata.outputs.is_major == 'true'
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted labels available while this workflow is maintained.
        # macOS 13 has no hosted image anymore; deployment-target and unit
        # tests cover it, with physical-device QA documented in PERFORMANCE.md.
        # The regular build-and-test matrix already covers macOS 15 and 26.
        runner: [macos-14]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Debug build
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Unit test
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Release build and bundle checks
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/LuminaDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="${DERIVED_DATA_PATH}/Build/Products/Release/Lumina.app"
          test -d "${app_path}"
          test -d "${app_path}/Contents/PlugIns/Lumina.saver"
          test ! -e "${app_path}/Contents/Frameworks/LuminaNativeLock.framework"
          test ! -e "${app_path}/Contents/MacOS/lumina-native-tool"
      - name: Upload compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/LuminaDerivedData/Build/Products/Release/Lumina.app
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release artifact
    needs: [metadata, build-and-test, major_compatibility]
    if: >-
      always() &&
      needs.metadata.outputs.is_tag == 'true' &&
      needs.build-and-test.result == 'success' &&
      (needs.metadata.outputs.is_major != 'true' || needs.major_compatibility.result == 'success')
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build portable app once on representative runner
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/LuminaDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="${DERIVED_DATA_PATH}/Build/Products/Release/Lumina.app"
          test -d "${app_path}"
          test -d "${app_path}/Contents/PlugIns/Lumina.saver"
          test ! -e "${app_path}/Contents/Frameworks/LuminaNativeLock.framework"
          test ! -e "${app_path}/Contents/MacOS/lumina-native-tool"
          codesign --force --deep --sign - "${app_path}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "${app_path}" \
            "dist/Lumina-macOS-portable.zip"
          (
            cd dist
            shasum -a 256 "Lumina-macOS-portable.zip" \
              > "Lumina-macOS-portable.zip.sha256"
            shasum -a 256 -c "Lumina-macOS-portable.zip.sha256"
          )
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-macOS-portable
          path: |
            dist/Lumina-macOS-portable.zip
            dist/Lumina-macOS-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    needs: [metadata, package]
    if: always() && needs.metadata.outputs.is_tag == 'true' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumina-macOS-portable
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/Lumina-macOS-portable.zip \
              dist/Lumina-macOS-portable.zip.sha256 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/Lumina-macOS-portable.zip \
              dist/Lumina-macOS-portable.zip.sha256 \
              --title "Lumina ${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --generate-notes
          fi
