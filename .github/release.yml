changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
  categories:
    - title: "✨ Features"
      labels:
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "⚙️ CI and Maintenance"
      labels:
        - github_actions
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "🧩 Other Changes"
      labels:
        - "*"
